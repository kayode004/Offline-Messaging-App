workflows:
  android-release:
    name: Android Release Build
    environment:
      flutter: "2.10.5"    # Flutter version compatible with your Dart constraints
      java: 11              # Fixes Unsupported class file major version 61
    scripts:
      # Step 1: Ensure packages are installed
      - name: Get Flutter packages
        script: flutter pub get

      # Step 2: Update Gradle wrapper to compatible version
      - name: Fix Gradle wrapper
        script: |
          cd android
          ./gradlew wrapper --gradle-version 7.5 --distribution-type all
          cd ..

      # Step 3: Build APK release
      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
